<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>主赛道公司列表</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="track-table-freeze.css" />
    <link rel="stylesheet" href="ranking-cards.css?v=20260909-cards" />
    <link rel="stylesheet" href="sidebar.css?v=20260909-nav" />
  </head>
  <body>
    <aside class="investment-sidebar" id="investmentSidebar" aria-label="主导航"></aside>

    <main class="dashboard track-page">
      <header class="hero track-hero">
        <div>
          <p class="eyebrow">TRACK VIEW · EMBODIED AI</p>
          <h1 id="trackTitle">主赛道公司列表</h1>
          <p class="hero-copy" id="trackSubtitle">累计融资额综合公开披露与可估算信息；由于许多公司未完整披露金额，页面展示为便于横向比较的估计量级。</p>
        </div>
        <div class="hero-actions">
          <a href="index.html">返回首页</a>
        </div>
      </header>

      <section class="track-stat-panel" id="trackStats" aria-label="赛道统计" hidden>
        <div class="section-title">
          <span>Track Snapshot</span>
          <h2>赛道快照</h2>
        </div>
        <div class="track-stat-grid" id="trackStatCards"></div>
      </section>

      <section class="report-frame table-frame">
        <div class="section-title">
          <span>Company List</span>
          <h2 id="tableTitle">公司列表</h2>
        </div>
        <div class="table-wrap">
          <table class="company-table">
            <colgroup>
              <col class="col-company" />
              <col class="col-region" />
              <col class="col-year" />
              <col class="col-direction" />
              <col class="col-round" />
              <col class="col-value" />
              <col class="col-funding" />
              <col class="col-value" />
            </colgroup>
            <thead>
              <tr>
                <th>公司名称</th>
                <th>地区/城市</th>
                <th>成立年份</th>
                <th>主营方向</th>
                <th>最新融资轮次</th>
                <th><button class="sort-button is-active" type="button" data-sort="latestValuation" aria-label="按最新估值排序">最新估值 <span aria-hidden="true">↓</span></button></th>
                <th><button class="sort-button" type="button" data-sort="cumulativeFunding" aria-label="按累计融资额排序">累计融资额 <span aria-hidden="true">↕</span></button></th>
                <th>最新轮金额</th>
              </tr>
            </thead>
            <tbody id="companyRows"></tbody>
          </table>
        </div>
        <p class="empty-state" id="emptyState" hidden>当前主赛道暂无公司数据。</p>
      </section>
    </main>

    <script src="data.js"></script>
    <script src="data-amount-overrides.js"></script>
    <script src="data-extras-a.js"></script>
    <script src="data-extras-b.js"></script>
    <script src="data-track-cleanup.js"></script>
    <script src="data-ipo-quotes.js?v=20260909-cards"></script>
    <script src="sidebar-icons.js?v=20260909-nav"></script>
    <script src="sidebar.js?v=20260909-library"></script>
    <script src="track.js?v=20260909-cards"></script>
  </body>
</html>
